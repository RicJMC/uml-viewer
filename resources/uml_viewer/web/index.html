<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UML viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="stage"></div>
<div id="status" hidden>Disconnected — waiting for the viewer…</div>
<div id="mobile" aria-label="Viewer controls">
  <button id="back" type="button" title="Up a level">←</button>
  <button id="fit" type="button" title="Fit the diagram">Fit</button>
</div>
<button id="quit" type="button" title="Stop the viewer">Quit</button>
<section id="card" hidden>
  <header id="card-head"><span id="card-title"></span><button id="card-close" type="button" aria-label="Close">×</button></header>
  <div id="card-body"></div>
</section>
<div id="menu" hidden></div>
<section id="source" hidden>
  <header><span id="source-title"></span><button id="source-close" type="button" aria-label="Close">×</button></header>
  <iframe id="source-frame" title="Source"></iframe>
</section>
<script src="/app.js"></script>
</body>
</html>

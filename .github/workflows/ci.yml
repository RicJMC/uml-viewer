name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python quality extra
        run: python3 -m pip install -e '.[quality]'

      - name: Test (Clojure, speclj)
        run: PYTHONPATH=src clojure -M:spec

      - name: Test (Python adapters, unittest)
        run: python3 -m unittest discover -s spec/uml_viewer_python -v
